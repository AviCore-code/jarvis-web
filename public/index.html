<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis — Face to Face</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="voice-sensor.css">
  <style>
    .grid.voice-only { grid-template-columns: minmax(0, 1fr); }
    .grid.voice-only .core-stage { width: 100%; max-width: 900px; margin-inline: auto; }
    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }
  </style>
</head>
<body>
  <!-- Startup tap overlay — dismissed on first tap/click -->
  <div id="startOverlay" style="
    position:fixed;inset:0;z-index:9999;
    background:rgba(0,8,20,0.92);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;user-select:none;
  " aria-label="แตะเพื่อเริ่ม Jarvis">
    <div style="font-family:'Orbitron',sans-serif;color:#00ffe7;font-size:clamp(1.2rem,4vw,2rem);letter-spacing:.15em;text-align:center;margin-bottom:1.5rem;">
      JARVIS LIVE
    </div>
    <div style="font-family:'Rajdhani',sans-serif;color:#7fffd4;font-size:clamp(1rem,3vw,1.4rem);letter-spacing:.1em;animation:pulse-tap 1.4s ease-in-out infinite;text-align:center;">
      ▶ แตะที่นี่เพื่อเปิดใช้งาน
    </div>
    <div style="font-family:'Rajdhani',sans-serif;color:#4a9080;font-size:.85rem;margin-top:1rem;text-align:center;">
      (เปิดไมโครโฟน + เสียงพร้อมกัน)
    </div>
  </div>
  <style>
    @keyframes pulse-tap { 0%,100%{opacity:.5;transform:scale(1)} 50%{opacity:1;transform:scale(1.05)} }
  </style>
  <canvas id="particles"></canvas>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <div class="app">
    <!-- Top bar -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"><span class="brand-mark-inner"></span></div>
        <div class="brand-text">
          <p class="brand-eyebrow">HERMES AGENT · NEURAL LINK</p>
          <h1>JARVIS <span>LIVE</span></h1>
        </div>
      </div>
      <div class="topbar-right">
        <button id="micStatus" class="device-status off" aria-label="Microphone off" title="กด เปิด/ปิด ไมโครโฟน">MIC OFF</button>
        <button id="speakerStatus" class="device-status off" aria-label="Speaker muted" title="กด เปิดเสียง">SPEAKER MUTED</button>
        <div class="clock" id="clock">--:--:--</div>
        <div class="status-pill" id="connStatus">
          <span class="pulse-dot"></span>
          <span>CONNECTING</span>
        </div>
      </div>
    </header>

    <!-- Main grid -->
    <main class="grid voice-only">
      <!-- Center: Jarvis core -->
      <section class="core-stage">
        <div class="core-telemetry top">
          <span>NEURAL SYNC</span><strong id="syncPct">100%</strong>
        </div>
        <div class="core-wrap">
          <div class="ring ring-outer"></div>
          <div class="ring ring-mid"></div>
          <div class="ring ring-inner"></div>
          <svg class="wave-ring" viewBox="0 0 200 200">
            <circle id="waveCircle" cx="100" cy="100" r="86" />
          </svg>
          <div class="core-orb cyborg-face" id="cyborgFace" data-state="standby">
            <svg class="face-svg" viewBox="0 0 200 200" aria-hidden="true">
              <defs>
                <linearGradient id="shellGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#1c2c44"/>
                  <stop offset="60%" stop-color="#0c1626"/>
                  <stop offset="100%" stop-color="#060c18"/>
                </linearGradient>
              </defs>
              <!-- head shell -->
              <path class="face-shell" d="M100 14c-38 0-62 24-62 60v34c0 16 6 28 16 38 12 12 28 20 46 20s34-8 46-20c10-10 16-22 16-38V74c0-36-24-60-62-60Z" fill="url(#shellGrad)"/>
              <!-- panel seams -->
              <path class="face-seam" d="M40 92h120M40 118h120" />
              <!-- temple lights -->
              <circle class="temple-light temple-left" cx="34" cy="96" r="4"/>
              <circle class="temple-light temple-right" cx="166" cy="96" r="4"/>
              <!-- visor -->
              <rect class="face-visor" x="42" y="66" width="116" height="40" rx="18"/>
              <!-- brows -->
              <path class="brow brow-left" id="browLeft" d="M58 68 L88 74"/>
              <path class="brow brow-right" id="browRight" d="M112 74 L142 68"/>
              <!-- eyes -->
              <g class="eye eye-left" id="eyeLeft">
                <ellipse class="eye-glow" cx="73" cy="86" rx="15" ry="11"/>
                <ellipse class="eye-pupil" cx="73" cy="86" rx="5.5" ry="5.5"/>
              </g>
              <g class="eye eye-right" id="eyeRight">
                <ellipse class="eye-glow" cx="127" cy="86" rx="15" ry="11"/>
                <ellipse class="eye-pupil" cx="127" cy="86" rx="5.5" ry="5.5"/>
              </g>
              <!-- cheek panel lights -->
              <circle class="cheek-light cheek-left" cx="48" cy="122" r="2.6"/>
              <circle class="cheek-light cheek-right" cx="152" cy="122" r="2.6"/>
              <!-- mouth: segmented LED grille that reacts to speech amplitude -->
              <g class="mouth" id="mouthBars" transform="translate(64 138)">
                <rect class="mouth-bar" data-i="0" x="0" y="4" width="7" height="4" rx="2"/>
                <rect class="mouth-bar" data-i="1" x="10" y="3" width="7" height="6" rx="2"/>
                <rect class="mouth-bar" data-i="2" x="20" y="2" width="7" height="8" rx="2"/>
                <rect class="mouth-bar" data-i="3" x="30" y="1" width="8" height="10" rx="2"/>
                <rect class="mouth-bar" data-i="4" x="42" y="1" width="8" height="10" rx="2"/>
                <rect class="mouth-bar" data-i="5" x="54" y="2" width="7" height="8" rx="2"/>
                <rect class="mouth-bar" data-i="6" x="64" y="3" width="7" height="6" rx="2"/>
                <rect class="mouth-bar" data-i="7" x="74" y="4" width="7" height="4" rx="2"/>
              </g>
            </svg>
            <div class="core-shine"></div>
          </div>
          <div class="particle-dot p1"></div>
          <div class="particle-dot p2"></div>
          <div class="particle-dot p3"></div>
          <div class="particle-dot p4"></div>
        </div>
        <div class="core-caption">
          <span>ASSISTANT STATE</span>
          <strong id="coreState">STANDBY</strong>
        </div>
        <div class="waveform" id="waveform">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="voice-sensor" id="voiceSensor">
          <div class="sensor-head">
            <span class="sensor-dot" id="sensorDot"></span>
            <span id="sensorLabel">VOICE SENSOR STANDBY</span>
          </div>
          <div class="eq-bars" id="eqBars">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
          <div id="micRecovery" style="display:none;margin-top:8px;text-align:center;">
            <button id="enableMicBtn" type="button"
              aria-label="เปิดไมโครโฟน — แตะเพื่อลองใหม่"
              style="background:rgba(0,200,120,0.15);border:1px solid rgba(0,200,120,0.5);color:#00c878;padding:6px 18px;border-radius:4px;font-size:0.8rem;letter-spacing:0.05em;cursor:pointer;">
              แตะเพื่อลองใหม่
            </button>
            <p id="micRecoveryHint" style="margin:4px 0 0;font-size:0.72rem;color:#aaa;letter-spacing:0.04em;"></p>
          </div>
        </div>
        <div class="core-telemetry bottom">
          <span>MODEL</span><strong id="modelName">hermes-agent</strong>
        </div>
      </section>

      <div id="chatLog" class="sr-only" aria-live="polite" aria-atomic="false"></div>
    </main>

    <footer class="footer-strip">
      <span>JARVIS WEB · POWERED BY HERMES AGENT API SERVER</span>
      <span id="latency">LATENCY --ms</span>
    </footer>
  </div>

  <!-- Audio element for TTS playback -->
  <audio id="jarvisAudio" preload="auto" playsinline></audio>

  <script src="app.js"></script>
  <script>
  (function () {
    'use strict';

    // ─── State ────────────────────────────────────────────────────────────────
    var messages = [];              // conversation history (max 20)
    var currentState = 'standby';  // standby|listening|recording|transcribing|thinking|speaking
    var conversationMode = null;    // created after app.js loads
    var micStream = null;
    var audioCtx = null;
    var analyser = null;
    var mediaRecorder = null;
    var recordingChunks = [];
    var isRecording = false;
    var vadRisingTimer = null;
    var vadFallingTimer = null;
    var vadActive = false;
    var audioUnlocked = false;
    var ttsQueue = [];
    var ttsPlaying = false;
    var currentAiBubble = null;
    var currentAiText = '';
    var streamingBuffer = '';
    var sentenceSendTimer = null;
    var eqBarsEl = null;
    var sensorLabel = null;
    var sensorDot = null;
    var vadInterval = null;
    var micInitPending = null;
    var speakerMuted = true;
    var currentAudioUrl = null;
    var KNOWN_NAME_KEY = 'jarvis.knownName';
    var startupGreetingStarted = false;
    var startupGreetingPending = false;
    var startupGreetingFinished = false;
    var currentTtsItem = null;
    var ttsRetryInFlight = false;
    var ttsGeneration = 0;
    var vadSource = null;
    var enableMicBtn = null;
    var micRecoveryEl = null;
    var micRecoveryHint = null;

    // ─── DOM refs ──────────────────────────────────────────────────────────────
    var clockEl = document.getElementById('clock');
    var connStatusEl = document.getElementById('connStatus');
    var latencyEl = document.getElementById('latency');
    var coreStateEl = document.getElementById('coreState');
    var cyborgFaceEl = document.getElementById('cyborgFace');
    var chatLogEl = document.getElementById('chatLog');

    var jarvisAudio = document.getElementById('jarvisAudio');
    var micStatusEl = document.getElementById('micStatus');
    var speakerStatusEl = document.getElementById('speakerStatus');
    enableMicBtn = document.getElementById('enableMicBtn');
    micRecoveryEl = document.getElementById('micRecovery');
    micRecoveryHint = document.getElementById('micRecoveryHint');

    // ─── Mic recovery helpers ─────────────────────────────────────────────────
    function showMicRecovery(hint, canRetry) {
      if (!micRecoveryEl) return;
      micRecoveryEl.style.display = 'block';
      if (micRecoveryHint) micRecoveryHint.textContent = hint || '';
      if (enableMicBtn) enableMicBtn.style.display = canRetry ? 'inline-block' : 'none';
    }
    function hideMicRecovery() {
      if (micRecoveryEl) micRecoveryEl.style.display = 'none';
    }
    if (enableMicBtn) {
      enableMicBtn.addEventListener('click', function () {
        hideMicRecovery();
        initMic();
      });
    }

    // ─── MIC button toggle ─────────────────────────────────────────────────────
    micStatusEl.addEventListener('click', function () {
      if (micStream) {
        // stream live → toggle track enabled
        var tracks = micStream.getAudioTracks();
        var isEnabled = tracks.length > 0 && tracks[0].enabled;
        if (isEnabled) {
          tracks.forEach(function (t) { t.enabled = false; });
          setMicIndicator(false, 'paused');
        } else {
          tracks.forEach(function (t) { t.enabled = true; });
          setMicIndicator(true);
        }
      } else {
        // no stream → clear stale state then request permission
        if (micStream) { teardownMic('retry'); micStream = null; }
        micInitPending = null;
        initMic();
      }
    });

    // ─── SPEAKER button toggle ─────────────────────────────────────────────────
    speakerStatusEl.addEventListener('click', function () {
      speakerMuted = !speakerMuted;
      jarvisAudio.muted = speakerMuted;
      if (speakerMuted) {
        setSpeakerIndicator(false, 'muted');
        speakerStatusEl.title = 'กด เปิดเสียง (Unmute)';
      } else {
        setSpeakerIndicator(!jarvisAudio.paused);
        speakerStatusEl.title = 'กด ปิดเสียง (Mute)';
        // if TTS was playing while muted, resume
        if (!jarvisAudio.paused) jarvisAudio.play().catch(function(){});
      }
    });

    function setMicIndicator(on, detail) {
      micStatusEl.textContent = on ? 'MIC ON' : 'MIC OFF';
      micStatusEl.classList.toggle('on', !!on);
      micStatusEl.classList.toggle('off', !on);
      micStatusEl.setAttribute('aria-label', 'Microphone ' + (on ? 'on' : 'off') + (detail ? ': ' + detail : ''));
    }

    function setSpeakerIndicator(on, detail) {
      var effectiveOn = on && !speakerMuted;
      speakerStatusEl.textContent = speakerMuted ? 'SPEAKER MUTED' : (effectiveOn ? 'SPEAKER ON' : 'SPEAKER OFF');
      speakerStatusEl.classList.toggle('on', effectiveOn);
      speakerStatusEl.classList.toggle('off', !effectiveOn);
      speakerStatusEl.setAttribute('aria-label', speakerMuted ? 'Speaker muted' : ('Speaker ' + (effectiveOn ? 'on' : 'off') + (detail ? ': ' + detail : '')));
    }

    function normalizeKnownName(value) {
      return String(value || '').replace(/[<>\r\n]/g, '').replace(/\s+/g, ' ').trim().slice(0, 40);
    }

    function getKnownName() {
      try { return normalizeKnownName(localStorage.getItem(KNOWN_NAME_KEY)); }
      catch (e) { return ''; }
    }

    function rememberKnownName(value) {
      var name = normalizeKnownName(value);
      if (!name) return;
      try { localStorage.setItem(KNOWN_NAME_KEY, name); } catch (e) {}
    }

    function rememberNameFromText(text) {
      var match = String(text || '').match(/(?:ผมชื่อ|ฉันชื่อ|ดิฉันชื่อ|ชื่อผมคือ|my name is)\s*([^,.!?\n]{1,40})/i);
      if (match) rememberKnownName(match[1]);
    }

    function buildStartupGreeting() {
      var name = getKnownName();
      return name ? 'สวัสดีครับคุณ' + name + ' วันนี้มีอะไรให้รับใช้ครับ' : 'สวัสดีครับ วันนี้มีอะไรให้รับใช้ครับ';
    }

    // ─── Clock ────────────────────────────────────────────────────────────────
    function updateClock() {
      var now = new Date();
      var h = String(now.getHours()).padStart(2, '0');
      var m = String(now.getMinutes()).padStart(2, '0');
      var s = String(now.getSeconds()).padStart(2, '0');
      clockEl.textContent = h + ':' + m + ':' + s;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ─── State machine ────────────────────────────────────────────────────────
    function setState(state) {
      currentState = state;
      var label = state.toUpperCase();
      coreStateEl.textContent = label;
      cyborgFaceEl.setAttribute('data-state', state);

      var sensorLabelEl = document.getElementById('sensorLabel');
      if (sensorLabelEl) {
        if (state === 'listening') sensorLabelEl.textContent = 'LISTENING - รอคำสั่ง...';
        else if (state === 'recording') sensorLabelEl.textContent = 'RECORDING - บันทึกเสียง...';
        else if (state === 'transcribing') sensorLabelEl.textContent = 'TRANSCRIBING - ถอดเสียง...';
        else if (state === 'thinking') sensorLabelEl.textContent = 'THINKING - ประมวลผล...';
        else if (state === 'speaking') sensorLabelEl.textContent = 'SPEAKING - กำลังพูด...';
        else sensorLabelEl.textContent = 'VOICE SENSOR STANDBY';
      }
    }

    // ─── Health check ─────────────────────────────────────────────────────────
    function checkHealth() {
      var t0 = Date.now();
      fetch('api/health')
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var ms = Date.now() - t0;
          if (data && data.ok) {
            var span = connStatusEl.querySelector('span:last-child');
            if (span) span.textContent = 'ONLINE';
            connStatusEl.classList.add('online');
            connStatusEl.classList.remove('offline');
            var dot = connStatusEl.querySelector('.pulse-dot');
            if (dot) dot.style.background = '#00ff88';
          } else {
            setOffline();
          }
          latencyEl.textContent = 'LATENCY ' + ms + 'ms';
        })
        .catch(function () { setOffline(); });
    }

    function setOffline() {
      var span = connStatusEl.querySelector('span:last-child');
      if (span) span.textContent = 'OFFLINE';
      connStatusEl.classList.add('offline');
      connStatusEl.classList.remove('online');
      var dot = connStatusEl.querySelector('.pulse-dot');
      if (dot) dot.style.background = '#ff4444';
    }

    checkHealth();
    setInterval(checkHealth, 30000);


    // ─── Chat UI helpers ──────────────────────────────────────────────────────
    function appendUserBubble(text) {
      var div = document.createElement('div');
      div.className = 'msg user';
      div.textContent = text;
      chatLogEl.appendChild(div);
      chatLogEl.scrollTop = chatLogEl.scrollHeight;
      return div;
    }

    function appendAiBubble() {
      var div = document.createElement('div');
      div.className = 'msg ai';
      chatLogEl.appendChild(div);
      chatLogEl.scrollTop = chatLogEl.scrollHeight;
      return div;
    }

    function updateAiBubble(bubble, text, streaming) {
      // Safe text update with optional blinking cursor
      bubble.textContent = text + (streaming ? '|' : '');
      chatLogEl.scrollTop = chatLogEl.scrollHeight;
    }

    // ─── TTS queue ────────────────────────────────────────────────────────────
    function enqueueTts(text, kind, prepend) {
      if (!text || !text.trim()) return;
      var item = { text: text.trim(), kind: kind || 'assistant' };
      if (prepend) ttsQueue.unshift(item);
      else ttsQueue.push(item);
      if (!ttsPlaying) playNextTts();
    }

    function playNextTts() {
      if (ttsQueue.length === 0) {
        ttsPlaying = false;
        if (currentState === 'speaking') setState('standby');
        return;
      }
      ttsPlaying = true;
      currentTtsItem = ttsQueue.shift();
      var item = currentTtsItem;
      var generation = ++ttsGeneration;
      setState('speaking');
      fetch('api/speak', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: item.text })
      })
        .then(function (r) {
          if (generation !== ttsGeneration || currentTtsItem !== item) return null;
          if (!r.ok) throw new Error('TTS failed');
          return r.blob();
        })
        .then(function (blob) {
          if (!blob || generation !== ttsGeneration || currentTtsItem !== item) return;
          if (currentAudioUrl) URL.revokeObjectURL(currentAudioUrl);
          var url = URL.createObjectURL(blob);
          currentAudioUrl = url;
          jarvisAudio.src = url;
          return jarvisAudio.play();
        })
        .catch(function (e) {
          if (generation !== ttsGeneration || currentTtsItem !== item) return;
          console.warn('[jarvis] TTS error:', e);
          if (e && e.name === 'NotAllowedError') {
            startupGreetingPending = currentTtsItem && currentTtsItem.kind === 'greeting';
            ttsPlaying = true;
            setState(micStream ? 'listening' : 'standby');
            setSpeakerIndicator(false, 'tap to enable');
            return;
          }
          if (currentTtsItem && currentTtsItem.kind === 'greeting') {
            startupGreetingPending = false;
            startupGreetingFinished = true;
          }
          currentTtsItem = null;
          ttsPlaying = false;
          playNextTts();
        });
    }

    jarvisAudio.addEventListener('ended', function () {
      setSpeakerIndicator(false);
      if (currentTtsItem && currentTtsItem.kind === 'greeting') {
        startupGreetingFinished = true;
        startupGreetingPending = false;
      }
      currentTtsItem = null;
      releaseCurrentAudioUrl();
      ttsPlaying = false;
      playNextTts();
    });

    jarvisAudio.addEventListener('error', function () {
      setSpeakerIndicator(false, 'playback error');
      if (currentTtsItem && currentTtsItem.kind === 'greeting') {
        startupGreetingFinished = true;
        startupGreetingPending = false;
      }
      currentTtsItem = null;
      ttsRetryInFlight = false;
      releaseCurrentAudioUrl();
      ttsPlaying = false;
      playNextTts();
    });

    jarvisAudio.addEventListener('playing', function () {
      setSpeakerIndicator(true);
      if (currentTtsItem && currentTtsItem.kind === 'greeting') startupGreetingPending = false;
    });

    jarvisAudio.addEventListener('pause', function () {
      setSpeakerIndicator(false);
    });

    function startStartupGreeting() {
      if (startupGreetingStarted) return;
      startupGreetingStarted = true;
      startupGreetingPending = true;
      enqueueTts(buildStartupGreeting(), 'greeting', true);
    }

    function retryDeferredTts() {
      if (!currentTtsItem || !jarvisAudio.src || !jarvisAudio.paused || ttsRetryInFlight) return;
      ttsRetryInFlight = true;
      setState('speaking');
      Promise.resolve(jarvisAudio.play()).then(function () {
        ttsRetryInFlight = false;
      }).catch(function (e) {
        ttsRetryInFlight = false;
        if (e && e.name === 'NotAllowedError') {
          setState(micStream ? 'listening' : 'standby');
          setSpeakerIndicator(false, 'tap to enable');
          return;
        }
        if (currentTtsItem && currentTtsItem.kind === 'greeting') {
          startupGreetingPending = false;
          startupGreetingFinished = true;
        }
        currentTtsItem = null;
        releaseCurrentAudioUrl();
        ttsPlaying = false;
        console.warn('[jarvis] deferred TTS error:', e);
        playNextTts();
      });
    }

    function retryStartupGreeting() {
      retryDeferredTts();
    }

    function releaseCurrentAudioUrl() {
      if (!currentAudioUrl) return;
      URL.revokeObjectURL(currentAudioUrl);
      currentAudioUrl = null;
    }

    // ─── Interrupt / barge-in ─────────────────────────────────────────────────
    function interruptSpeaking() {
      if (currentState === 'speaking') {
        ttsGeneration++;
        if (currentTtsItem && currentTtsItem.kind === 'greeting') {
          startupGreetingPending = false;
          startupGreetingFinished = true;
        }
        jarvisAudio.pause();
        setSpeakerIndicator(false);
        jarvisAudio.src = '';
        releaseCurrentAudioUrl();
        ttsQueue = [];
        currentTtsItem = null;
        ttsRetryInFlight = false;
        ttsPlaying = false;
        setState('listening');
      }
    }

    // ─── Sentence detection for early TTS ────────────────────────────────────
    var sentencePattern = /[.?!\n。？！ๆ]+/;

    function flushSentences(fullText, isFinal) {
      if (isFinal) {
        // Send whatever remains
        var remaining = fullText.trim();
        if (remaining) enqueueTts(remaining);
        streamingBuffer = '';
        return;
      }
      // Try to find complete sentences in new text
      var parts = fullText.split(sentencePattern);
      if (parts.length > 1) {
        // There is at least one complete sentence
        for (var i = 0; i < parts.length - 1; i++) {
          var sent = parts[i].trim();
          if (sent) enqueueTts(sent);
        }
        // Keep the incomplete last part
        streamingBuffer = parts[parts.length - 1] || '';
      } else {
        streamingBuffer = fullText;
      }
    }

    // ─── Chat / SSE streaming ─────────────────────────────────────────────────
    function submitMessage(text) {
      if (!text || !text.trim()) return;
      text = text.trim();
      rememberNameFromText(text);

      // Add to history
      messages.push({ role: 'user', content: text });
      if (messages.length > 20) messages = messages.slice(messages.length - 20);

      appendUserBubble(text);
      currentAiBubble = appendAiBubble();
      currentAiText = '';
      streamingBuffer = '';
      setState('thinking');

      fetch('api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: messages.slice() })
      })
        .then(function (r) {
          if (!r.ok) throw new Error('Chat API error ' + r.status);
          return r.body.getReader();
        })
        .then(function (reader) {
          var decoder = new TextDecoder();
          var buf = '';

          function pump() {
            return reader.read().then(function (result) {
              if (result.done) {
                // Stream finished
                updateAiBubble(currentAiBubble, currentAiText, false);
                flushSentences(streamingBuffer, true);
                // Add AI response to history
                if (currentAiText) {
                  messages.push({ role: 'assistant', content: currentAiText });
                  if (messages.length > 20) messages = messages.slice(messages.length - 20);
                }
                if (currentState === 'thinking') setState('standby');
                return;
              }

              buf += decoder.decode(result.value, { stream: true });
              var lines = buf.split('\n');
              buf = lines.pop(); // keep partial line

              for (var i = 0; i < lines.length; i++) {
                var line = lines[i].trim();
                if (!line || !line.startsWith('data:')) continue;
                var jsonStr = line.slice(5).trim();
                if (jsonStr === '[DONE]') {
                  updateAiBubble(currentAiBubble, currentAiText, false);
                  flushSentences(streamingBuffer, true);
                  if (currentAiText) {
                    messages.push({ role: 'assistant', content: currentAiText });
                    if (messages.length > 20) messages = messages.slice(messages.length - 20);
                  }
                  if (currentState === 'thinking') setState('standby');
                  return;
                }
                try {
                  var obj = JSON.parse(jsonStr);
                  var delta = obj.choices &&
                              obj.choices[0] &&
                              obj.choices[0].delta &&
                              obj.choices[0].delta.content;
                  if (delta) {
                    currentAiText += delta;
                    streamingBuffer += delta;
                    updateAiBubble(currentAiBubble, currentAiText, true);
                    // Try to flush complete sentences
                    flushSentences(streamingBuffer, false);
                  }
                } catch (e) {
                  // ignore parse errors on partial chunks
                }
              }
              return pump();
            });
          }
          return pump();
        })
        .catch(function (e) {
          console.error('[jarvis] chat error:', e);
          if (currentAiBubble) {
            currentAiBubble.textContent = '[เกิดข้อผิดพลาด: ' + e.message + ']';
          }
          setState('standby');
        });
    }


    // ─── Voice / VAD ──────────────────────────────────────────────────────────
    var VAD_THRESHOLD = 0.015;
    var VAD_RISE_MS = 300;
    var VAD_FALL_MS = 1200;

    function setupVad(stream) {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (vadSource) {
          try { vadSource.disconnect(); } catch (e) {}
        }
        vadSource = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        analyser.smoothingTimeConstant = 0.4;
        vadSource.connect(analyser);

        eqBarsEl = document.getElementById('eqBars');
        sensorLabel = document.getElementById('sensorLabel');
        sensorDot = document.getElementById('sensorDot');

        var dataArray = new Uint8Array(analyser.frequencyBinCount);

        if (vadInterval) clearInterval(vadInterval);
        vadInterval = setInterval(function () {
          analyser.getByteTimeDomainData(dataArray);
          // Compute RMS
          var sum = 0;
          for (var i = 0; i < dataArray.length; i++) {
            var v = (dataArray[i] / 128.0) - 1.0;
            sum += v * v;
          }
          var rms = Math.sqrt(sum / dataArray.length);

          // Update EQ bars visual
          if (eqBarsEl) {
            var bars = eqBarsEl.querySelectorAll('span');
            analyser.getByteFrequencyData(dataArray);
            var step = Math.floor(dataArray.length / bars.length);
            for (var j = 0; j < bars.length; j++) {
              var val = dataArray[j * step] / 255;
              bars[j].style.height = Math.max(4, val * 40) + 'px';
              bars[j].style.opacity = 0.4 + val * 0.6;
            }
          }

          // Update level label
          if (sensorLabel && currentState === 'listening') {
            var pct = Math.round(Math.min(100, rms * 400));
            sensorLabel.textContent = 'LISTENING - LEVEL ' + pct + '%';
          }

          // VAD logic — blocked while thinking/speaking/transcribing
          var blocked = currentState === 'thinking' ||
                        currentState === 'speaking' ||
                        currentState === 'transcribing';

          if (blocked) {
            // If speaking and user talks loud → barge-in
            if (currentState === 'speaking' && rms > VAD_THRESHOLD * 2) {
              interruptSpeaking();
            }
            return;
          }

          if (rms > VAD_THRESHOLD) {
            // Voice detected
            if (!vadActive) {
              if (!vadRisingTimer) {
                vadRisingTimer = setTimeout(function () {
                  vadActive = true;
                  vadRisingTimer = null;
                  startRecording(stream);
                }, VAD_RISE_MS);
              }
              // Clear any falling timer
              if (vadFallingTimer) {
                clearTimeout(vadFallingTimer);
                vadFallingTimer = null;
              }
            } else if (isRecording) {
              // Still recording, voice active — reset falling timer
              if (vadFallingTimer) {
                clearTimeout(vadFallingTimer);
                vadFallingTimer = null;
              }
            }
          } else {
            // Silence
            if (vadRisingTimer) {
              clearTimeout(vadRisingTimer);
              vadRisingTimer = null;
            }
            if (vadActive && isRecording && !vadFallingTimer) {
              vadFallingTimer = setTimeout(function () {
                vadFallingTimer = null;
                vadActive = false;
                stopRecording();
              }, VAD_FALL_MS);
            }
          }
        }, 100);

        setState('listening');
        console.log('[jarvis] VAD started');
      } catch (e) {
        console.warn('[jarvis] VAD setup failed:', e);
      }
    }

    function teardownMic(reason) {
      if (vadInterval) { clearInterval(vadInterval); vadInterval = null; }
      if (vadRisingTimer) { clearTimeout(vadRisingTimer); vadRisingTimer = null; }
      if (vadFallingTimer) { clearTimeout(vadFallingTimer); vadFallingTimer = null; }
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        try { mediaRecorder.stop(); } catch (e) {}
      }
      mediaRecorder = null;
      isRecording = false;
      vadActive = false;
      if (vadSource) { try { vadSource.disconnect(); } catch (e) {} vadSource = null; }
      analyser = null;
      micStream = null;
      window._micStream = null;
      setMicIndicator(false, reason || 'unavailable');
      if (currentState === 'listening' || currentState === 'recording') setState('standby');
    }

    function startRecording(stream) {
      if (isRecording) return;
      recordingChunks = [];
      try {
        var mimeType = 'audio/webm;codecs=opus';
        if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'audio/webm';
        if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = '';
        mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType: mimeType } : {});
        mediaRecorder.ondataavailable = function (e) {
          if (e.data && e.data.size > 0) recordingChunks.push(e.data);
        };
        mediaRecorder.start(100);
        isRecording = true;
        setState('recording');
      } catch (e) {
        console.warn('[jarvis] MediaRecorder failed:', e);
        vadActive = false;
        isRecording = false;
      }
    }

    function stopRecording() {
      if (!isRecording || !mediaRecorder) return;
      isRecording = false;
      mediaRecorder.stop();
      mediaRecorder.onstop = function () {
        var blob = new Blob(recordingChunks, { type: 'audio/webm' });
        recordingChunks = [];
        if (blob.size < 1000) {
          // Too small — ignore
          setState('listening');
          return;
        }
        sendToTranscribe(blob);
      };
    }

    function sendToTranscribe(blob) {
      setState('transcribing');
      var form = new FormData();
      form.append('audio', blob, 'audio.webm');
      fetch('api/transcribe', { method: 'POST', body: form })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var text = data && data.text ? data.text.trim() : '';
          if (!text) {
            setState('listening');
            return;
          }
          handleVoiceTranscript(text);
        })
        .catch(function (e) {
          console.warn('[jarvis] transcribe error:', e);
          setState('listening');
        });
    }

    function handleVoiceTranscript(text) {
      if (!conversationMode) {
        // Fallback: direct submit
        submitMessage(text);
        return;
      }
      routeVoiceTranscript(conversationMode, text, {
        submit: function (clean) {
          submitMessage(clean);
        },
        localReply: function (reply, action) {
          if (action === 'ready') {
            appendAiBubble().textContent = reply;
            enqueueTts(reply);
          } else if (action === 'end') {
            appendAiBubble().textContent = reply;
            enqueueTts(reply);
            setState('standby');
          }
        }
      });
    }

    // ─── Mic setup ────────────────────────────────────────────────────────────
    function initMic() {
      if (micInitPending) return micInitPending;
      if (micStream && micStream.getAudioTracks().some(function (track) { return track.readyState === 'live' && track.enabled; })) {
        setMicIndicator(true);
        return Promise.resolve(micStream);
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setMicIndicator(false, 'unsupported');
        return Promise.resolve(null);
      }
      micInitPending = navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        },
        video: false
      })
        .then(function (stream) {
          micStream = stream;
          window._micStream = stream;
          setMicIndicator(true);
          hideMicRecovery();
          stream.getAudioTracks().forEach(function (track) {
            track.addEventListener('ended', function () {
              teardownMic('track ended');
            });
            track.addEventListener('mute', function () { setMicIndicator(false, 'muted'); });
            track.addEventListener('unmute', function () { setMicIndicator(true); });
          });
          setupVad(stream);
          return stream;
        })
        .catch(function (e) {
          var eName = (e && e.name) || 'unavailable';
          setMicIndicator(false, eName);
          console.warn('[jarvis] mic error:', eName, e && e.message);
          var lbl = document.getElementById('sensorLabel');
          if (eName === 'NotAllowedError' || eName === 'PermissionDeniedError') {
            // browser has blocked permission — user must open site settings
            if (lbl) lbl.textContent = 'MIC UNAVAILABLE — กรุณาอนุญาตไมโครโฟนในการตั้งค่าเบราว์เซอร์';
            showMicRecovery('เปิด Settings → Site / App permissions → Microphone → Allow แล้วกลับมา', false);
          } else if (eName === 'NotFoundError' || eName === 'DevicesNotFoundError') {
            if (lbl) lbl.textContent = 'ไม่พบไมโครโฟน — กรุณาเสียบอุปกรณ์แล้วลองใหม่';
            showMicRecovery('ไม่พบอุปกรณ์ไมโครโฟน — เสียบแล้วแตะเพื่อลองใหม่', true);
          } else if (eName === 'NotReadableError' || eName === 'TrackStartError') {
            if (lbl) lbl.textContent = 'ไมโครโฟนถูกใช้งานโดยแอปอื่น — ปิดแอปอื่นแล้วลองใหม่';
            showMicRecovery('อุปกรณ์ไมโครโฟนถูกใช้งานอยู่ — แตะเพื่อลองใหม่', true);
          } else {
            if (lbl) lbl.textContent = 'MIC UNAVAILABLE — แตะหน้าจอเพื่ออนุญาต';
            showMicRecovery('', true);
          }
          return null;
        })
        .finally(function () { micInitPending = null; });
      return micInitPending;
    }

    // ─── Permission pre-check ─────────────────────────────────────────────────
    if (navigator.permissions && navigator.permissions.query) {
      navigator.permissions.query({ name: 'microphone' }).then(function (result) {
        if (result.state === 'denied') {
          setMicIndicator(false, 'blocked');
          showMicRecovery('กด 🔒 หน้า URL → Site settings → Microphone → Allow → Reload', false);
          var lbl = document.getElementById('sensorLabel');
          if (lbl) lbl.textContent = 'MIC BLOCKED — เปิดสิทธิ์ใน Site Settings';
        }
        result.onchange = function () {
          if (result.state === 'granted') { hideMicRecovery(); initMic(); }
          if (result.state === 'denied') {
            teardownMic('blocked'); micStream = null; micInitPending = null;
            showMicRecovery('กด 🔒 หน้า URL → Site settings → Microphone → Allow → Reload', false);
          }
        };
      }).catch(function () {});
    }

    // ─── Audio unlock ────────────────────────────────────────────────────────
    function unlockAudio() {
      // Dismiss startup overlay on first gesture
      var overlay = document.getElementById('startOverlay');
      if (overlay && overlay.style.display !== 'none') {
        overlay.style.transition = 'opacity .4s';
        overlay.style.opacity = '0';
        setTimeout(function () { overlay.style.display = 'none'; }, 420);
      }
      if (audioUnlocked) {
        retryStartupGreeting();
        if (!micStream) initMic();
        return;
      }
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      audioCtx.resume().then(function () {
        audioUnlocked = true;
        retryStartupGreeting();
        if (!micStream) initMic();
      }).catch(function () {
        audioUnlocked = false;
        setSpeakerIndicator(false, 'audio locked');
      });
    }

    document.addEventListener('click', unlockAudio);
    document.addEventListener('touchstart', unlockAudio);
    window.addEventListener('pagehide', function () {
      releaseCurrentAudioUrl();
      if (micStream) micStream.getTracks().forEach(function (track) { track.stop(); });
      teardownMic('page hidden');
    });

    // ─── Init conversation mode (app.js functions available globally) ─────────
    function initConversationMode() {
      if (typeof createConversationMode === 'function') {
        conversationMode = createConversationMode();
      }
    }

    // ─── Boot ─────────────────────────────────────────────────────────────────
    function boot() {
      initConversationMode();
      setMicIndicator(false);
      jarvisAudio.muted = true;
      setSpeakerIndicator(false);
      startStartupGreeting();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }

  })();
  </script>
</body>
</html>
