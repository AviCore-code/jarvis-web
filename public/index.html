<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis — Face to Face</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="voice-sensor.css">
  <link rel="stylesheet" href="text-toggle.css">
</head>
<body>
  <canvas id="particles"></canvas>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <div class="app">
    <!-- Top bar -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"><span class="brand-mark-inner"></span></div>
        <div class="brand-text">
          <p class="brand-eyebrow">HERMES AGENT · NEURAL LINK</p>
          <h1>JARVIS <span>LIVE</span></h1>
        </div>
      </div>
      <div class="topbar-right">
        <button id="toggleChatPanel" class="mini-toggle" type="button" title="เปิด/ปิดหน้าต่างข้อความ">TEXT ON</button>
        <div class="clock" id="clock">--:--:--</div>
        <div class="status-pill" id="connStatus">
          <span class="pulse-dot"></span>
          <span>CONNECTING</span>
        </div>
      </div>
    </header>

    <!-- Main grid -->
    <main class="grid">
      <!-- Left: video panel -->
      <section class="panel video-panel">
        <div class="panel-label"><span>01</span> LIVE FEED</div>
        <div class="video-wrap">
          <video id="localVideo" autoplay muted playsinline></video>
          <canvas id="captureCanvas" hidden></canvas>
          <div class="video-overlay">
            <div class="corner tl"></div><div class="corner tr"></div>
            <div class="corner bl"></div><div class="corner br"></div>
            <div class="video-hud-top">
              <span id="camState" class="hud-chip off">CAM OFF</span>
              <span id="micState" class="hud-chip off">MIC OFF</span>
            </div>
            <div class="scan-bar" aria-hidden="true"></div>
          </div>
          <div class="video-placeholder" id="videoPlaceholder">
            <div class="ring-loader"></div>
            <p>กดเปิดกล้องเพื่อเริ่มการสนทนา</p>
          </div>
        </div>
        <div class="video-controls">
          <button id="toggleCam" class="ctrl-btn" type="button" title="เปิด/ปิดกล้อง">
            <svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4Z"/></svg>
            <span>CAMERA</span>
          </button>
          <button id="toggleMic" class="ctrl-btn" type="button" title="เปิด/ปิดไมค์">
            <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
            <span>MIC</span>
          </button>
          <button id="unlockAudio" class="ctrl-btn sound" type="button" title="เปิดเสียง Jarvis / ทดสอบเสียง">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3Zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.06A4.5 4.5 0 0 0 16.5 12Zm0-8.5v2.06A7.5 7.5 0 0 1 20 12a7.5 7.5 0 0 1-3.5 6.44v2.06A9.5 9.5 0 0 0 22 12a9.5 9.5 0 0 0-5.5-8.5Z"/></svg>
            <span>SPEAKER</span>
          </button>
          <audio id="jarvisAudio" preload="auto" playsinline></audio>
          <button id="askVision" class="ctrl-btn accent" type="button" title="ให้ Jarvis ดูภาพตอนนี้">
            <svg viewBox="0 0 24 24"><path d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7Zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10Zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg>
            <span>ให้ดูภาพ</span>
          </button>
          <button id="pushToTalk" class="ctrl-btn talk" type="button" title="กดค้างเพื่อพูด">
            <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
            <span>กดค้างเพื่อพูด</span>
          </button>
        </div>
      </section>

      <!-- Center: Jarvis core -->
      <section class="core-stage">
        <div class="core-telemetry top">
          <span>NEURAL SYNC</span><strong id="syncPct">100%</strong>
        </div>
        <div class="core-wrap">
          <div class="ring ring-outer"></div>
          <div class="ring ring-mid"></div>
          <div class="ring ring-inner"></div>
          <svg class="wave-ring" viewBox="0 0 200 200">
            <circle id="waveCircle" cx="100" cy="100" r="86" />
          </svg>
          <div class="core-orb cyborg-face" id="cyborgFace" data-state="standby">
            <svg class="face-svg" viewBox="0 0 200 200" aria-hidden="true">
              <defs>
                <linearGradient id="shellGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#1c2c44"/>
                  <stop offset="60%" stop-color="#0c1626"/>
                  <stop offset="100%" stop-color="#060c18"/>
                </linearGradient>
              </defs>
              <!-- head shell -->
              <path class="face-shell" d="M100 14c-38 0-62 24-62 60v34c0 16 6 28 16 38 12 12 28 20 46 20s34-8 46-20c10-10 16-22 16-38V74c0-36-24-60-62-60Z" fill="url(#shellGrad)"/>
              <!-- panel seams -->
              <path class="face-seam" d="M40 92h120M40 118h120" />
              <!-- temple lights -->
              <circle class="temple-light temple-left" cx="34" cy="96" r="4"/>
              <circle class="temple-light temple-right" cx="166" cy="96" r="4"/>
              <!-- visor -->
              <rect class="face-visor" x="42" y="66" width="116" height="40" rx="18"/>
              <!-- brows -->
              <path class="brow brow-left" id="browLeft" d="M58 68 L88 74"/>
              <path class="brow brow-right" id="browRight" d="M112 74 L142 68"/>
              <!-- eyes -->
              <g class="eye eye-left" id="eyeLeft">
                <ellipse class="eye-glow" cx="73" cy="86" rx="15" ry="11"/>
                <ellipse class="eye-pupil" cx="73" cy="86" rx="5.5" ry="5.5"/>
              </g>
              <g class="eye eye-right" id="eyeRight">
                <ellipse class="eye-glow" cx="127" cy="86" rx="15" ry="11"/>
                <ellipse class="eye-pupil" cx="127" cy="86" rx="5.5" ry="5.5"/>
              </g>
              <!-- cheek panel lights -->
              <circle class="cheek-light cheek-left" cx="48" cy="122" r="2.6"/>
              <circle class="cheek-light cheek-right" cx="152" cy="122" r="2.6"/>
              <!-- mouth: segmented LED grille that reacts to speech amplitude -->
              <g class="mouth" id="mouthBars" transform="translate(64 138)">
                <rect class="mouth-bar" data-i="0" x="0" y="4" width="7" height="4" rx="2"/>
                <rect class="mouth-bar" data-i="1" x="10" y="3" width="7" height="6" rx="2"/>
                <rect class="mouth-bar" data-i="2" x="20" y="2" width="7" height="8" rx="2"/>
                <rect class="mouth-bar" data-i="3" x="30" y="1" width="8" height="10" rx="2"/>
                <rect class="mouth-bar" data-i="4" x="42" y="1" width="8" height="10" rx="2"/>
                <rect class="mouth-bar" data-i="5" x="54" y="2" width="7" height="8" rx="2"/>
                <rect class="mouth-bar" data-i="6" x="64" y="3" width="7" height="6" rx="2"/>
                <rect class="mouth-bar" data-i="7" x="74" y="4" width="7" height="4" rx="2"/>
              </g>
            </svg>
            <div class="core-shine"></div>
          </div>
          <div class="particle-dot p1"></div>
          <div class="particle-dot p2"></div>
          <div class="particle-dot p3"></div>
          <div class="particle-dot p4"></div>
        </div>
        <div class="core-caption">
          <span>ASSISTANT STATE</span>
          <strong id="coreState">STANDBY</strong>
        </div>
        <div class="waveform" id="waveform">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="voice-sensor" id="voiceSensor">
          <div class="sensor-head">
            <span class="sensor-dot" id="sensorDot"></span>
            <span id="sensorLabel">VOICE SENSOR STANDBY</span>
          </div>
          <div class="eq-bars" id="eqBars">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
        <div class="core-telemetry bottom">
          <span>MODEL</span><strong id="modelName">hermes-agent</strong>
        </div>
      </section>

      <!-- Right: conversation -->
      <section class="panel chat-panel">
        <div class="panel-label"><span>02</span> CONVERSATION</div>
        <div id="chatLog" class="chat-log"></div>
        <form id="chatForm" class="chat-input-row">
          <input id="chatInput" type="text" placeholder="พิมพ์ข้อความ หรือใช้เสียง..." autocomplete="off">
          <button type="submit" class="send-btn" aria-label="ส่ง">
            <svg viewBox="0 0 24 24"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg>
          </button>
        </form>
      </section>
    </main>

    <footer class="footer-strip">
      <span>JARVIS WEB · POWERED BY HERMES AGENT API SERVER</span>
      <span id="latency">LATENCY --ms</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
